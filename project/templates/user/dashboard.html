{% extends 'layouts/base_user_dashboard.html' %}

{% block content %}
<style>
  :root {
    --page-bg: var(--neutral-bg);
    --card-bg: var(--neutral-white);
    --text: var(--neutral-900);
    --muted: var(--neutral-600);
    --shadow: var(--shadow-md);
  }

  /* Remove local body.dark-mode palette overrides (use global base palette) */

  body {
    background-color: var(--page-bg);
    color: var(--text);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .border {
    border-color: var(--neutral-200) !important;
  }

  .bg-light {
    background-color: var(--card-bg) !important;
    transition: background-color 0.3s ease;
  }

  .rounded {
    background-color: var(--card-bg);
    color: var(--text);
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  .text-muted {
    color: var(--muted) !important;
  }

  .alert {
    transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
  }

  /* Keep info alert readable in dark mode using theme tokens */
  body.dark-mode .alert-info {
    background-color: color-mix(in srgb, var(--primary-teal) 14%, transparent);
    border-color: color-mix(in srgb, var(--primary-teal) 40%, transparent);
    color: var(--text);
  }

  .fw-bold {
    color: var(--text);
  }

  h2 {
    color: var(--text);
    transition: color 0.3s ease;
  }

  footer {
    color: var(--muted);
    transition: color 0.3s ease;
  }
</style>

<div class="border rounded p-4 bg-light">
  <h2 class="fw-bold">Dashboard</h2>
  <p class="text-muted">Welcome to your Find It Fast dashboard. Browse and manage lost & found items here.</p>

  <div class="alert alert-info text-center mt-4">
    No approved items found.
  </div>

  <footer class="mt-5 text-center text-muted">
    © 2025 Find It Fast - User Dashboard
  </footer>
</div>

<script>
/* Dark mode is controlled globally in base_user_dashboard.html */
</script>
{% endblock %}
