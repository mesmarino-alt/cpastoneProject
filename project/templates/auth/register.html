{% extends 'layouts/base_landing.html' %}
{% block title %}Register | Find It Fast{% endblock %}
{% block content %}
<div class="register-wrapper mx-auto" style="max-width: 280px; padding: .35rem;">

  <h6 class="text-center mb-2" style="font-weight: 700; font-size: .98rem;">Register</h6>

  <form method="post" enctype="multipart/form-data" style="font-size: 0.86rem;">
    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Full name</label>
      <input type="text" class="form-control form-control-sm" name="name" required style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Student ID</label>
      <input type="text" class="form-control form-control-sm" name="student_id" required style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">I am a</label>
      <select class="form-control form-control-sm" name="role" required style="padding-top: .46rem; padding-bottom: .46rem;">
        <option value="user">Student</option>
        <option value="faculty">Faculty Member</option>
      </select>
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Email</label>
      <input type="email" class="form-control form-control-sm" name="email" required style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Password</label>
      <input type="password" class="form-control form-control-sm" name="password" required style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Confirm password</label>
      <input type="password" class="form-control form-control-sm" name="confirm" required style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <div class="mb-1">
      <label class="form-label" style="margin-bottom: .25rem;">Profile photo (optional)</label>
      <input type="file" class="form-control form-control-sm" name="profile_photo" accept="image/*" style="padding-top: .46rem; padding-bottom: .46rem;">
    </div>

    <button type="submit" class="btn btn-brand btn-sm w-100" style="padding-top: .55rem; padding-bottom: .55rem;">Create Account</button>

    <p class="text-center mt-1 mb-0" style="font-size: 0.78rem;">
      <small>Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></small>
    </p>
  </form>
</div>
{% endblock %}
