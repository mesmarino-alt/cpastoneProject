<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Find It Fast{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, rgba(20, 40, 100, 0.4) 0%, rgba(10, 20, 50, 0.45) 100%),
                  url('{{ url_for("static", filename="images/back.jpg") }}') center/cover no-repeat fixed;
      background-attachment: fixed;
      background-blend-mode: overlay;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .landing-card {
      display: flex;
      flex-direction: row;
      width: 100%;
      max-width: 900px;
      border-radius: 24px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      position: relative; /* allow absolute children like modal */
    }

    .landing-left {
      flex: 3;
      background: linear-gradient(to bottom right, rgba(0, 180, 216, 0.75), rgba(0, 119, 182, 0.75));
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .landing-left img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      margin-bottom: 1rem;
      filter:
        drop-shadow(0 0 10px rgba(138, 43, 226, 0.75))
        drop-shadow(0 0 24px rgba(138, 43, 226, 0.55))
        drop-shadow(0 0 44px rgba(111, 34, 181, 0.40));
      animation: brandGlowImg 2.2s ease-in-out infinite;
    }

    .landing-left h2 {
      text-align: center;
      margin: 0;
      font-weight: 500;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      color: #ffffff;
      letter-spacing: 0.6px;
      text-shadow:
        0 0 8px rgba(255, 255, 255, 0.55),
        0 0 18px rgba(138, 43, 226, 0.90),
        0 0 38px rgba(138, 43, 226, 0.65),
        0 0 58px rgba(111, 34, 181, 0.55);
      animation: brandGlowText 2.2s ease-in-out infinite;
    }

    .landing-right {
      flex: 2;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
    }

    .landing-right h4 {
      font-weight: 700;
      margin-bottom: 1.5rem;
      color: #111827;
      font-size: 1.4rem;
    }

    .form-control {
      border-radius: 10px;
      border: 1.5px solid rgba(0, 0, 0, 0.1);
      background: rgba(255, 255, 255, 0.9);
      padding: 0.75rem 1rem;
      font-size: 0.95rem;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      outline: none;
      border-color: #00b4d8;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: 0 0 0 4px rgba(0, 180, 216, 0.15);
    }

    .form-control::placeholder {
      color: rgba(0, 0, 0, 0.4);
    }

    .form-label {
      font-weight: 600;
      color: #1f2937;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    .btn-brand {
      background: linear-gradient(135deg, #00b4d8 0%, #0096c7 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.5rem;
      font-weight: 700;
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0, 180, 216, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 1rem;
    }

    .btn-brand:hover {
      background: linear-gradient(135deg, #0096c7 0%, #00809d 100%);
      transform: translateY(-2px);
      box-shadow: 0 15px 35px rgba(0, 180, 216, 0.4);
    }

    .btn-brand:active {
      transform: translateY(0);
      box-shadow: 0 5px 15px rgba(0, 180, 216, 0.3);
    }

    .form-text {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .form-text a {
      color: #00b4d8;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .form-text a:hover {
      color: #0096c7;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .landing-card {
        flex-direction: column;
        margin: 1rem;
      }
      .landing-left, .landing-right {
        flex: none;
        width: 100%;
      }
      .landing-left {
        padding: 1.5rem 1rem;
        min-height: auto;
      }
      .landing-left img {
        width: 80px;
        height: 80px;
      }
      .landing-left p {
        font-size: 0.9rem;
      }
      .landing-right {
        padding: 1.5rem 1rem;
      }
      .landing-right h4 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
      }
    }

    @media (max-width: 480px) {
      .landing-card {
        margin: 0.5rem;
        border-radius: 0.75rem;
      }
      body {
        padding: 0.5rem;
      }
      .landing-left, .landing-right {
        padding: 1rem !important;
      }
      .landing-left img {
        width: 60px;
        height: 60px;
        margin-bottom: 0.5rem;
      }
      .landing-left p {
        font-size: 0.8rem;
      }
      .landing-right h4 {
        font-size: 1.1rem;
      }
      .form-control, .btn {
        font-size: 16px;
      }
    }

    /* Flash modal anchored top-left inside landing-card */
    .flash-modal-top-left .modal-dialog {
      position: absolute;
      top: 1rem;
      left: 1rem;
      margin: 0;
      max-width: 300px;
      transform: translateX(-120%); /* start off-screen */
      transition: transform 0.4s ease-out, opacity 0.4s ease-out;
      opacity: 0;
    }

    .flash-modal-top-left.show .modal-dialog {
      transform: translateX(0); /* slide into view */
      opacity: 1;
    }

    .flash-modal-top-left .modal-content {
      border-radius: 8px;
    }

    /* ===== Glowing brand (logo + title) ===== */
    @keyframes brandGlowImg {
      0%, 100% {
        filter:
          drop-shadow(0 0 8px rgba(138, 43, 226, 0.60))
          drop-shadow(0 0 18px rgba(138, 43, 226, 0.45))
          drop-shadow(0 0 34px rgba(111, 34, 181, 0.30));
        transform: translateY(0) scale(1);
      }
      50% {
        filter:
          drop-shadow(0 0 14px rgba(138, 43, 226, 0.95))
          drop-shadow(0 0 34px rgba(138, 43, 226, 0.75))
          drop-shadow(0 0 66px rgba(111, 34, 181, 0.60));
        transform: translateY(-3px) scale(1.03);
      }
    }

    @keyframes brandGlowText {
      0%, 100% {
        text-shadow:
          0 0 6px rgba(255, 255, 255, 0.40),
          0 0 14px rgba(138, 43, 226, 0.70),
          0 0 28px rgba(138, 43, 226, 0.52),
          0 0 44px rgba(111, 34, 181, 0.40);
        opacity: 0.92;
      }
      50% {
        text-shadow:
          0 0 10px rgba(255, 255, 255, 0.70),
          0 0 24px rgba(138, 43, 226, 1.00),
          0 0 52px rgba(138, 43, 226, 0.75),
          0 0 80px rgba(111, 34, 181, 0.70);
        opacity: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .landing-left img,
      .landing-left h2 {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="landing-card">
    <div class="landing-left">
      <img src="{{ url_for('static', filename='images/logo_new.png') }}" alt="Seal" />
      <br>
      <h2>FindITFast</h2>
    </div>
    <div class="landing-right">
      {% block content %}{% endblock %}
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <!-- Sliding Modal inside landing-card -->
          <div class="modal fade flash-modal-top-left" id="flashModal{{ loop.index }}" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog">
              <div class="modal-content">
                <div class="modal-header bg-{{ category }}">
                  <h5 class="modal-title text-white">{{ category|capitalize }}</h5>
                  <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                  {{ msg }}
                </div>
              </div>
            </div>
          </div>

          <script>
            document.addEventListener('DOMContentLoaded', () => {
              var modalEl = document.getElementById('flashModal{{ loop.index }}');
              var flashModal = new bootstrap.Modal(modalEl);
              flashModal.show();
              // Auto-dismiss after 3s
              setTimeout(() => flashModal.hide(), 3000);
            });
          </script>
        {% endfor %}
      {% endif %}
    {% endwith %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
